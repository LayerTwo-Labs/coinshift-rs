[package]
name = "coinshift"
authors.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
version.workspace = true

[build-dependencies]
prost = { workspace = true }
prost-build = "0.14.4"
protox = "0.9.1"
tonic-build = "0.14.6"
tonic-prost-build = "0.14.6"

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
async-lock = "3.4.0"
bincode = { workspace = true }
bitcoin = { workspace = true, features = ["serde"] }
blake3 = "1.4.1"
borsh = { version = "1.6.1", features = ["derive"] }
byteorder = "1.4.3"
bytes = "1.4.0"
clap = { workspace = true, features = ["derive"], optional = true }
ed25519-dalek = { version = "2.1.1", features = ["batch", "serde"] }
ed25519-dalek-bip32 = "0.3.0"
fallible-iterator = { workspace = true }
error-fatality = "0.1.2"
futures = "0.3.30"
hashlink = { version = "0.12.1", features = ["serde_impl"] }
heed = "0.22.1"
hex = { version = "0.4.3", features = ["serde"] }
jsonrpsee = { workspace = true }
merkle-cbt = "0.3.2"
nonempty = { version = "0.11.0", features = ["serialize"] }
parking_lot = { workspace = true }
prost = { workspace = true }
prost-types = "0.14.4"
quinn = "0.11.6"
rayon = "1.7.0"
reqwest = { version = "0.13", features = ["blocking", "json"] }
rcgen = "0.14.9"
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
rustreexo = { workspace = true, features = ["with-serde"] }
smallvec = { version = "1.13.2", features = ["write"] }
semver = { version = "1.0.25", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { version = "3.4.0" }
sneed = { version = "0.0.22", features = ["observe"] }
strum = { workspace = true }
thiserror = { workspace = true }
tiny-bip39 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1.15", features = ["sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
transitive = "1.2.0"
utoipa = { workspace = true, features = ["macros", "non_strict_integers"] }

[dependencies.educe]
version = "0.6.0"
default-features = false
features = ["Clone", "Debug"]

[dependencies.governor]
version = "0.8.1"
default-features = false
features = ["quanta", "std"]

[features]
clap = ["dep:clap"]

[dev-dependencies]
temp-dir = "0.2"

[lints]
workspace = true

[lib]
name = "coinshift"
path = "lib.rs"
