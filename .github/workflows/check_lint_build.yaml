
on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Base branch to diff against (only used when cargo_deny_check=auto)"
        type: string
        default: main
      cargo_deny_check:
        description: "Run or skip the `cargo deny` step"
        type: choice
        options:
          - auto
          - force-run
          - force-skip
        default: auto

name: Check, Lint, Build

env:
  CARGO_TERM_COLOR: always
  ELECTRS_VERSION: v3.2.0

jobs:
  check-lint:
    name: Check, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      
      - name: Install latest nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Restore Rust cache
        id: restore-rust-cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-all-crates: "true"
          prefix-key: "v0-rust-nightly"
          save-if: "false"
          shared-key: debug-x86_64-unknown-linux-gnu

      - name: Save Rust cache
        if: steps.restore-rust-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-all-crates: "true"
          lookup-only: "true"
          prefix-key: "v0-rust-nightly"
          shared-key: debug-x86_64-unknown-linux-gnu

      - name: Rustfmt
        run: cargo fmt -- --check
      
      - name: Cargo check
        run: cargo check --all-targets --all-features
      
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      
      - name: Check changed files
        id: changed-files
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.cargo_deny_check == 'auto')
        uses: dorny/paths-filter@v4
        with:
          filters: |
            cargo_lock:
              - 'Cargo.lock'
            deny_toml:
              - 'deny.toml'

      - name: Deny
        if: >-
          (github.event_name == 'pull_request' && (steps.changed-files.outputs.cargo_lock == 'true' || steps.changed-files.outputs.deny_toml == 'true')) ||
          (github.event_name == 'workflow_dispatch' && inputs.cargo_deny_check == 'force-run') ||
          (github.event_name == 'workflow_dispatch' && inputs.cargo_deny_check == 'auto' && (steps.changed-files.outputs.cargo_lock == 'true' || steps.changed-files.outputs.deny_toml == 'true'))
        uses: EmbarkStudios/cargo-deny-action@v2

  cache-electrs:
    name: Build electrs if not cached
    runs-on: ubuntu-latest
    steps:
      - name: Check cache
        id: check-cache
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: ${{ runner.temp }}/electrs/target/release/electrs
          key: electrs-${{ env.ELECTRS_VERSION }}

      - name: Build electrs
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch ${{ env.ELECTRS_VERSION }} --depth 1 https://github.com/mempool/electrs.git ${{ runner.temp }}/electrs
          pushd ${{ runner.temp }}/electrs
          cargo build --locked --release
          popd

      - name: Save cache
        if: steps.check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/electrs/target/release/electrs
          key: electrs-${{ env.ELECTRS_VERSION }}


  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    needs: [cache-electrs, check-lint]
    steps:
      - name: Download latest bitcoin-patched
        run: |
          pushd ..
          wget https://releases.drivechain.info/L1-bitcoin-patched-latest-x86_64-unknown-linux-gnu.zip
          unzip L1-bitcoin-patched-latest-x86_64-unknown-linux-gnu.zip
          rm L1-bitcoin-patched-latest-x86_64-unknown-linux-gnu.zip
          mv L1-bitcoin-patched-latest-x86_64-unknown-linux-gnu bitcoin-patched-bins
          chmod +x bitcoin-patched-bins/bitcoind
          chmod +x bitcoin-patched-bins/bitcoin-cli
          popd

      - name: Restore electrs from cache
        uses: actions/cache/restore@v6
        with:
          fail-on-cache-miss: true
          path: ${{ runner.temp }}/electrs/target/release/electrs
          key: electrs-${{ env.ELECTRS_VERSION }}

      - name: Install latest nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-all-crates: "true"
          prefix-key: "v0-rust-nightly"
          shared-key: debug-x86_64-unknown-linux-gnu

      # The test harness comes from bip300301_enforcer_integration_tests, pinned
      # to a rev in Cargo.toml, and it has to agree with the enforcer binary on
      # the CLI. A downloaded "latest" build does not: the pinned rev takes
      # --serve-json-rpc-addr, latest renamed it to --serve-rpc-addr, and the
      # enforcer exits 2 before a single test runs. Reading the rev out of
      # Cargo.toml keeps harness and binary in lockstep by construction.
      - name: Resolve the pinned enforcer rev
        id: enforcer
        run: |
          rev="$(awk -F'"' '
            /^\[workspace\.dependencies\.bip300301_enforcer_lib\]/ { f = 1 }
            f && /^rev[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"
          [ -n "$rev" ] || { echo "could not read the pinned enforcer rev from Cargo.toml" >&2; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "Pinned enforcer rev: $rev"

      - name: Checkout bip300301_enforcer at the pinned rev
        run: |
          pushd ..
          git clone https://github.com/LayerTwo-Labs/bip300301_enforcer.git enforcer-src
          cd enforcer-src
          git checkout --quiet ${{ steps.enforcer.outputs.rev }}
          popd

      - name: Rust Cache (enforcer)
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-bin: false
          prefix-key: "v0-rust-enforcer-${{ steps.enforcer.outputs.rev }}"
          workspaces: ../enforcer-src -> target

      - name: Build bip300301_enforcer
        run: |
          pushd ../enforcer-src
          cargo build --release --bin bip300301_enforcer
          popd

      - name: Build (debug)
        run: cargo build

      - name: Run integration tests
        id: runIntegrationTests
        run: |
          export BIP300301_ENFORCER='../enforcer-src/target/release/bip300301_enforcer'
          export BITCOIND='../bitcoin-patched-bins/bitcoind'
          export BITCOIN_CLI='../bitcoin-patched-bins/bitcoin-cli'
          export ELECTRS='${{ runner.temp }}/electrs/target/release/electrs'
          export COINSHIFT_APP='target/debug/coinshift_app'
          cargo run -p coinshift_integration_tests --example integration_tests

  test-build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-unknown-linux-gnu
            binary-suffix: ""
            rustflags: ""
          # An Apple Silicon runner cross-compiles this target, and the
          # larger Intel runner is not available on every account.
          - os: macos-latest
            name: x86_64-apple-darwin
            binary-suffix: ""
            rustflags: ""
          - os: macos-latest
            name: aarch64-apple-darwin
            binary-suffix: ""
            rustflags: ""
          - os: ubuntu-latest
            name: x86_64-pc-windows-gnu
            binary-suffix: .exe
            rustflags: "-C linker=/usr/bin/x86_64-w64-mingw32-gcc"
    name: Test, Build, Release ((${{ matrix.name }}))
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      
      - name: Install latest nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          target: ${{ matrix.name }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-bin: false
          key: ${{ matrix.name }}

      - name: Install windows-specific deps
        run: sudo apt install mingw-w64
        if: ${{ matrix.name == 'x86_64-pc-windows-gnu' }}

      - name: Test
        run: cargo test --tests

      - name: Build
        run: cargo build --release --target ${{ matrix.name }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: 'Set environment variables: version number and output filenames'
        run: |
          COINSHIFT_APP_VERSION=$(cargo metadata --format-version 1 | \
            jq -er '.packages | map(select(.name == "coinshift_app") | .version) | .[0]')
          COINSHIFT_APP_FILENAME="coinshift-${COINSHIFT_APP_VERSION}-${{ matrix.name }}${{ matrix.binary-suffix }}"
          COINSHIFT_CLI_FILENAME="coinshift-cli-${COINSHIFT_APP_VERSION}-${{ matrix.name }}${{ matrix.binary-suffix }}"
          COINSHIFT_ZIP_FILENAME="coinshift-${COINSHIFT_APP_VERSION}-${{ matrix.name }}.zip"
          echo "COINSHIFT_APP_VERSION=$COINSHIFT_APP_VERSION" >> "$GITHUB_ENV"
          echo "COINSHIFT_APP_FILENAME=$COINSHIFT_APP_FILENAME" >> "$GITHUB_ENV"
          echo "COINSHIFT_CLI_FILENAME=$COINSHIFT_CLI_FILENAME" >> "$GITHUB_ENV"
          echo "COINSHIFT_ZIP_FILENAME=$COINSHIFT_ZIP_FILENAME" >> "$GITHUB_ENV"

      - name: 'Set filenames for release binaries'
        run: |
          pushd "target/${{ matrix.name }}/release/"
          ln -fs "coinshift_app${{ matrix.binary-suffix }}" "${COINSHIFT_APP_FILENAME}"
          ln -fs "coinshift_app_cli${{ matrix.binary-suffix }}" "${COINSHIFT_CLI_FILENAME}"
          popd

      - name: 'Pack the release zip'
        # BitWindow downloads one archive per platform and takes the daemon and
        # its CLI from it. The names inside are bare, which is what its
        # extractor looks for.
        run: |
          pushd "target/${{ matrix.name }}/release/"
          cp "coinshift_app${{ matrix.binary-suffix }}" "coinshift${{ matrix.binary-suffix }}"
          cp "coinshift_app_cli${{ matrix.binary-suffix }}" "coinshift-cli${{ matrix.binary-suffix }}"
          zip -j "${COINSHIFT_ZIP_FILENAME}" \
            "coinshift${{ matrix.binary-suffix }}" \
            "coinshift-cli${{ matrix.binary-suffix }}"
          popd

      - name: 'Upload Artifacts (coinshift)'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.COINSHIFT_APP_FILENAME }}
          if-no-files-found: error
          path: |
            target/${{ matrix.name }}/release/${{ env.COINSHIFT_APP_FILENAME }}
            target/${{ matrix.name }}/release/${{ env.COINSHIFT_CLI_FILENAME }}

      - name: Extract Git tag name
        id: git-tag-name
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "git_tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Parse Git tag name as semver
        uses: madhead/semver-utils@v5.0.0
        if: startsWith(github.ref, 'refs/tags/')
        id: parse-git-tag-name-semver
        with:
          version: ${{ steps.git-tag-name.outputs.git_tag_name }}

      - name: Release
        uses: softprops/action-gh-release@v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/${{ matrix.name }}/release/${{ env.COINSHIFT_APP_FILENAME }}
            target/${{ matrix.name }}/release/${{ env.COINSHIFT_CLI_FILENAME }}
            target/${{ matrix.name }}/release/${{ env.COINSHIFT_ZIP_FILENAME }}
          fail_on_unmatched_files: true
          prerelease: ${{ steps.parse-git-tag-name-semver.outputs.prerelease != '' }}

